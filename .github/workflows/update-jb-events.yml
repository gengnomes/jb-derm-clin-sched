name: Update calendar subscription feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: publish-calendar-feeds
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate calendar feeds and pages
        run: python src/fetch_jb_ics.py

      - name: Prepare published files
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-site"
          cp -R site/. "$RUNNER_TEMP/calendar-site/"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site="$RUNNER_TEMP/calendar-site"
          cd "$site"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jb-events.ics index.html
          git commit -m "Update calendar subscription feeds"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:gh-pages --force